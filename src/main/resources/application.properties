spring.application.name=democyber
server.port=8080

# --- Actuator (TP4) on its own management port ---
# 8081 is never published outside Docker: only Prometheus (inside the Compose network)
# and the container healthcheck use it. The public port 8080 has no /actuator.
management.server.port=8081
# Expose only what monitoring needs (the TP used "*", which also exposes env, beans, loggers...)
management.endpoints.web.exposure.include=health,info,prometheus
# /actuator/prometheus only needs GET (least privilege)
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true

# --- API key for GET /api/secure (header X-API-Key) ---
# Empty on purpose: with no key, /api/secure always answers 401 (fail closed).
# With Vault on, the value comes from secret/democyber (key api-key), never from Git.
api-key=

# --- HashiCorp Vault (Spring Cloud Vault) ---
# Off by default: the tests and a plain "java -jar" never call Vault, and /api/secure stays
# closed. compose.yml turns it on (SPRING_CLOUD_VAULT_ENABLED=true).
spring.config.import=optional:vault://
spring.cloud.vault.enabled=false
spring.cloud.vault.uri=http://vault:8200
# Login for machines: role-id and secret-id are given at startup (see compose.yml)
spring.cloud.vault.authentication=APPROLE
# Fail closed: if Vault refuses or cannot be reached, the app does not start
spring.cloud.vault.fail-fast=true
# Read secret/data/democyber only: no shared "application" context, no profile contexts
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.application-name=democyber
spring.cloud.vault.kv.default-context=
spring.cloud.vault.kv.profiles=
