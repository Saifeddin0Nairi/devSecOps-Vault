server.port=8080

# --- TP4 Monitoring: Actuator + Micrometer Prometheus ---
# Expose only what monitoring needs. The TP uses "*", which also exposes env, beans, loggers, mappings...
management.endpoints.web.exposure.include=health,info,prometheus
# Spring Boot 4 name of the TP's management.endpoint.prometheus.enabled=true (deprecated since Boot 3.4).
# read-only is enough: /actuator/prometheus only has a GET operation (least privilege).
management.endpoint.prometheus.access=read-only
# Current name of the old management.metrics.export.prometheus.enabled (the old name is ignored now)
management.prometheus.metrics.export.enabled=true
