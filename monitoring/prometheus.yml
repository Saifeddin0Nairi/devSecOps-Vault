# Prometheus configuration (used by compose.yml). Targets are Compose service names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself: should always be UP (sanity check)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The app, on its management port 8081 (reachable only inside the Compose network)
  - job_name: democyber
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["democyber:8081"]
        labels:
          application: democyber   # fills the "Application" filter of Grafana dashboard 11378

  # Vault: needs a token with the "metrics" policy, read from a file (never written here)
  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    authorization:
      credentials_file: /etc/prometheus/vault/vault-token
    static_configs:
      - targets: ["vault:8200"]
