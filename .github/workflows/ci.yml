# CI/CD for Democyber Vault: one job, like in the TPs (README section 5).
# Every action is pinned to a full commit SHA; the comment gives the version.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the GITHUB_TOKEN can only read the code.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The one image that is smoke-tested, scanned and (on main) published
      IMAGE: democyber-vault:ci-${{ github.sha }}

    steps:
      - name: Checkout (full history, for Gitleaks and SonarCloud)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false   # do not leave the token in .git/config

      # 1. Secret scan
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"                # same engine as the local scans
          GITLEAKS_ENABLE_COMMENTS: "false"         # no PR comments: the token stays read-only
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"  # the next step uploads the report, pass or fail

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: results.sarif

      # 2. Build + tests
      - name: Set up JDK 21 (with Maven cache)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test (Maven Wrapper)
        run: ./mvnw -B verify

      # 3. Code analysis + Quality Gate
      - name: SonarCloud scan (waits for the Quality Gate)
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/main,pom.xml,Dockerfile
            -Dsonar.tests=src/test
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.qualitygate.wait=true

      # 4. Image build
      - name: Build the Docker image
        run: docker build -t "$IMAGE" .

      # 5. Smoke test (fails the job, unlike the TP version)
      - name: Smoke test the image
        id: smoke
        run: |
          docker run -d --name democyber-smoke -p 127.0.0.1:8080:8080 "$IMAGE"
          ./scripts/smoke-test.sh democyber-smoke

      - name: Smoke test cleanup (app logs, then remove the container)
        if: always() && steps.smoke.outcome != 'skipped'
        run: |
          docker logs --tail 40 democyber-smoke
          docker rm -f democyber-smoke

      # 6. Image scan
      - name: Trivy scan (blocks HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-report.json

      # 7. Vault integration test: the same image, with Vault, vault-init and least privilege
      - name: Vault integration test
        env:
          DEMOCYBER_IMAGE: ${{ env.IMAGE }}   # the image tested and scanned above, never rebuilt
        run: |
          # .env for this run only: a random dev root token, hidden in the job log
          token=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          (umask 077 && printf 'VAULT_DEV_ROOT_TOKEN_ID=%s\n' "$token" > .env)
          ./scripts/test-vault-integration.sh

      # 8. Publish: only on a push to main, and only the exact image tested above
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push :<sha> and :latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/democyber-vault
        run: |
          docker tag "$IMAGE" "$REPO:$GITHUB_SHA"
          docker tag "$IMAGE" "$REPO:latest"
          docker push "$REPO:$GITHUB_SHA"
          docker push "$REPO:latest"
